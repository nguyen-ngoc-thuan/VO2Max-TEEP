; PlatformIO Project Configuration File
; VO2Max-TEEP - Improved DIY VO2 Max Spirometer
;
; Sensors: Omron D6F-PH0025AMD2, DFRobot SEN0322, BMP280
; Board: TTGO T-Display (ESP32 + 1.14" TFT)

[env:lilygo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
; Use huge_app.csv if firmware doesn't fit:
; board_build.partitions = huge_app.csv

build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; TFT_eSPI configuration (inline, no need to edit library files)
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MISO=-1
  -DTFT_MOSI=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=23
  -DTFT_BL=4
  -DTFT_BACKLIGHT_ON=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  h2zero/NimBLE-Arduino@1.4.1
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit Unified Sensor@^1.1.14

[platformio]
description = VO2Max-TEEP: Improved DIY portable spirometer for measuring VO2max
